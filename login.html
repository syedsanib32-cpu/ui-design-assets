<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Dr. Atanu Bhattacharjee</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============ LOGIN ============ -->
<main class="login-page">
  <div class="login-card">
    <div class="login-card__head">
      <h1>Login</h1>
      <p>Log in to get full access</p>
    </div>

    <form class="login-form" onsubmit="return false">
      <div class="login-field">
        <label for="email">Email Address</label>
        <div class="login-input">
          <input id="email" type="email" placeholder="eg. atanu@gmail.com" />
        </div>
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <div class="login-input login-input--pw">
          <input id="password" type="password" placeholder="••••••••" />
          <button type="button" class="login-input__eye" aria-label="Show password">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.3 8S3.7 3.5 8 3.5 14.7 8 14.7 8 12.3 12.5 8 12.5 1.3 8 1.3 8z"/><circle cx="8" cy="8" r="2.2"/></svg>
          </button>
        </div>
        <a href="#" class="login-forgot">Forgot Password?</a>
      </div>

      <label class="login-check">
        <input type="checkbox" />
        <span class="login-check__box" aria-hidden="true"></span>
        <span>Keep me signed in</span>
      </label>

      <button type="submit" class="btn btn--primary btn--login">Login</button>

      <p class="login-note">Security first. We'll get you back into your dashboard in no time.</p>
    </form>
  </div>
</main>

</body>
</html>
